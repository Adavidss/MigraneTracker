<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MigraineTracker</title>
    <meta
      name="description"
      content="A private, local-first visual journal for headaches and migraines. Your data never leaves your device."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Migraine" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14131a" />
    <script>
      // Apply the saved theme before first paint so the app never flashes the
      // wrong colour scheme on load.
      try {
        var saved = localStorage.getItem('mt.theme')
        var dark =
          saved === 'dark' ||
          ((!saved || saved === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        /* private mode — fall back to the light theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
